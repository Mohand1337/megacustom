name: Build Windows Portable

on:
  push:
    branches: [ main, master ]
    paths:
      - 'qt-gui/**'
      - 'src/**'
      - 'include/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

env:
  QT_VERSION: '6.6.0'
  BUILD_TYPE: Release

jobs:
  build-windows:
    # Qt 6.6's prebuilt MSVC package is compatible with VS 2022. Newer MSVC
    # toolsets removed stdext helpers still referenced by these Qt headers.
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test member registry diagnostic script
      run: ./tests/MemberRegistryDiagnosticScriptTests.ps1
      shell: pwsh

    - name: Test Windows FFmpeg tool resolver
      run: ./tests/WindowsFFmpegToolResolverTests.ps1
      shell: pwsh

    - name: Clone MEGA SDK
      run: |
        mkdir -p third_party
        git clone --depth 1 https://github.com/meganz/sdk.git third_party/sdk
      shell: bash

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2019_64
        modules: qtnetworkauth
        cache: true

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat
      shell: cmd

    - name: Install vcpkg packages (classic mode)
      run: |
        # Install all required packages using classic vcpkg mode
        # This gives us full control over package names and locations
        # Note: freeimage removed due to imath download issues on GitHub runners
        ${{ github.workspace }}/vcpkg/vcpkg.exe install --triplet x64-windows `
          cryptopp "curl[ssl]" icu libsodium sqlite3 zlib zstd c-ares `
          openssl "ffmpeg[avcodec,avformat,swresample,swscale,ffmpeg,ffprobe,drawtext,x264]" `
          libuv nlohmann-json
      shell: pwsh
      timeout-minutes: 75

    - name: Fix pkg-config aliases
      run: |
        $pkgconfigDir = "${{ github.workspace }}/vcpkg/installed/x64-windows/lib/pkgconfig"
        # SDK expects libcrypto++ but vcpkg provides cryptopp
        if (Test-Path "$pkgconfigDir/cryptopp.pc") {
          Copy-Item "$pkgconfigDir/cryptopp.pc" "$pkgconfigDir/libcrypto++.pc"
          Write-Host "Created libcrypto++.pc alias for cryptopp"
        }
        # List pkg-config files for debugging
        Write-Host "Available pkg-config files:"
        Get-ChildItem "$pkgconfigDir/*.pc" | ForEach-Object { Write-Host $_.Name }
      shell: pwsh

    - name: Build MEGA SDK
      run: |
        cd third_party/sdk
        if (!(Test-Path "build_sdk")) { mkdir build_sdk }
        cd build_sdk
        # Use the Visual Studio generator installed on the runner. The
        # windows-latest image can move between VS major versions.
        cmake .. -A x64 `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DVCPKG_MANIFEST_MODE=OFF `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DENABLE_SYNC=ON `
          -DENABLE_CHAT=OFF `
          -DENABLE_LOG_PERFORMANCE=OFF `
          -DENABLE_SDKLIB_EXAMPLES=OFF `
          -DENABLE_SDKLIB_TESTS=OFF `
          -DENABLE_SDKLIB_TOOLS=OFF `
          -DUSE_OPENSSL=ON `
          -DUSE_CURL=ON `
          -DUSE_SODIUM=ON `
          -DUSE_CRYPTOPP=ON `
          -DUSE_SQLITE=ON `
          -DUSE_FREEIMAGE=OFF `
          -DUSE_FFMPEG=ON `
          -DUSE_MEDIAINFO=OFF `
          -DUSE_LIBUV=ON `
          -DUSE_PDFIUM=OFF
        # The GUI links both static archives directly.
        cmake --build . --config ${{ env.BUILD_TYPE }} --target SDKlib ccronexpr --parallel

        if (!(Test-Path "Release/SDKlib.lib" -PathType Leaf)) {
          throw "Required MEGA SDK artifact was not built: Release/SDKlib.lib"
        }
        $ccronexprCandidates = @(
          "third_party/ccronexpr/ccronexpr.dir/Release/ccronexpr.lib",
          "third_party/ccronexpr/Release/ccronexpr.lib"
        )
        $ccronexprArtifact = $ccronexprCandidates |
          Where-Object { Test-Path $_ -PathType Leaf } |
          Select-Object -First 1
        if (!$ccronexprArtifact) {
          throw "Required ccronexpr artifact was not built. Checked: $($ccronexprCandidates -join ', ')"
        }
        Write-Host "Using ccronexpr artifact: $ccronexprArtifact"
      shell: pwsh
      timeout-minutes: 90

    - name: Configure Qt GUI
      run: |
        cd qt-gui
        cmake -B build-win64 -A x64 `
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }};${{ github.workspace }}/vcpkg/installed/x64-windows" `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DVCPKG_MANIFEST_MODE=OFF `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      shell: pwsh

    - name: Build Qt GUI
      run: |
        cd qt-gui
        cmake --build build-win64 --config ${{ env.BUILD_TYPE }} --parallel
      shell: pwsh

    - name: Verify manifest and watermark integration
      run: |
        $exe = "${{ github.workspace }}/qt-gui/build-win64/${{ env.BUILD_TYPE }}/MegaCustomGUI.exe"
        $manifest = "${{ runner.temp }}/MegaCustomGUI.manifest"
        & mt.exe -nologo "-inputresource:$exe;#1" "-out:$manifest"
        if (!(Select-String -Path $manifest -Pattern "longPathAware" -Quiet)) {
          throw "MegaCustomGUI.exe does not contain the longPathAware manifest"
        }

        $ffmpegTools = "${{ github.workspace }}/vcpkg/installed/x64-windows/tools/ffmpeg"
        $vcpkgBin = "${{ github.workspace }}/vcpkg/installed/x64-windows/bin"
        $env:PATH = "$ffmpegTools;$vcpkgBin;$env:PATH"
        ctest --test-dir qt-gui/build-win64 -C ${{ env.BUILD_TYPE }} --output-on-failure
      shell: pwsh

    - name: Create Portable Distribution
      run: |
        cd qt-gui

        # Create deployment directory
        $deployDir = "MegaCustomGUI-Portable"
        if (Test-Path $deployDir) { Remove-Item -Recurse -Force $deployDir }
        New-Item -ItemType Directory -Path $deployDir

        # Copy executable
        Copy-Item "build-win64/${{ env.BUILD_TYPE }}/MegaCustomGUI.exe" $deployDir/

        # Run windeployqt
        & "${{ env.Qt6_DIR }}/bin/windeployqt.exe" `
          --release `
          --no-translations `
          --no-system-d3d-compiler `
          --no-opengl-sw `
          "$deployDir/MegaCustomGUI.exe"

        # Copy vcpkg DLLs (classic mode location)
        $vcpkgBin = "${{ github.workspace }}/vcpkg/installed/x64-windows/bin"

        if (Test-Path $vcpkgBin) {
          Get-ChildItem "$vcpkgBin/*.dll" | Copy-Item -Destination $deployDir/
          Write-Host "Copied vcpkg DLLs from $vcpkgBin"
        }

        # Resolve and verify the exact FFmpeg pair used by the portable app.
        . "${{ github.workspace }}/scripts/windows-ffmpeg-tools.ps1"
        $ffmpegToolset = Resolve-MegaCustomFFmpegToolset `
          -VcpkgRoot "${{ github.workspace }}/vcpkg" `
          -SkipSystemCandidates
        if ($null -eq $ffmpegToolset) {
          throw "vcpkg did not produce ffmpeg.exe and ffprobe.exe together"
        }

        Copy-Item -LiteralPath $ffmpegToolset.FFmpeg -Destination $deployDir/
        Copy-Item -LiteralPath $ffmpegToolset.FFprobe -Destination $deployDir/

        $portableFFmpeg = Join-Path $deployDir "ffmpeg.exe"
        $portableFFprobe = Join-Path $deployDir "ffprobe.exe"
        & $portableFFmpeg -version | Select-Object -First 1
        if ($LASTEXITCODE -ne 0) {
          throw "The packaged ffmpeg.exe could not be executed"
        }
        & $portableFFprobe -version | Select-Object -First 1
        if ($LASTEXITCODE -ne 0) {
          throw "The packaged ffprobe.exe could not be executed"
        }

        $ffmpegFilters = (& $portableFFmpeg -hide_banner -filters 2>&1 | Out-String)
        $ffmpegFiltersExitCode = $LASTEXITCODE
        $drawtextLine = Find-MegaCustomFFmpegListEntry `
          -Output $ffmpegFilters `
          -Kind Filter `
          -Name drawtext
        if ($ffmpegFiltersExitCode -ne 0 -or !$drawtextLine) {
          Write-Host $ffmpegFilters
          throw "The packaged ffmpeg.exe does not provide the drawtext watermark filter"
        }

        $ffmpegEncoders = (& $portableFFmpeg -hide_banner -encoders 2>&1 | Out-String)
        $ffmpegEncodersExitCode = $LASTEXITCODE
        $libx264Line = Find-MegaCustomFFmpegListEntry `
          -Output $ffmpegEncoders `
          -Kind VideoEncoder `
          -Name libx264
        if ($ffmpegEncodersExitCode -ne 0 -or !$libx264Line) {
          Write-Host $ffmpegEncoders
          throw "The packaged ffmpeg.exe does not provide the libx264 video encoder"
        }
        Write-Host "Verified filter: $drawtextLine"
        Write-Host "Verified encoder: $libx264Line"
        Write-Host "Copied and verified FFmpeg, FFprobe, drawtext, and libx264 support"

        # Create resources directory
        New-Item -ItemType Directory -Path "$deployDir/resources/styles" -Force
        New-Item -ItemType Directory -Path "$deployDir/resources/icons" -Force
        Copy-Item "resources/styles/*.qss" "$deployDir/resources/styles/" -ErrorAction SilentlyContinue
        Copy-Item "resources/icons/*.ico" "$deployDir/resources/icons/" -ErrorAction SilentlyContinue

        # Copy scripts folder (for PDF watermarking and other features)
        $scriptsSource = "${{ github.workspace }}/scripts"
        if (Test-Path $scriptsSource) {
          New-Item -ItemType Directory -Path "$deployDir/scripts" -Force
          Copy-Item "$scriptsSource/pdf_watermark.py" "$deployDir/scripts/" -ErrorAction SilentlyContinue
          Copy-Item "$scriptsSource/download_manager.py" "$deployDir/scripts/" -ErrorAction SilentlyContinue
          Write-Host "Copied scripts folder"
        }

        # Copy fonts folder (for watermarking)
        $fontsSource = "${{ github.workspace }}/bin/fonts"
        if (Test-Path $fontsSource) {
          New-Item -ItemType Directory -Path "$deployDir/bin/fonts" -Force
          Copy-Item "$fontsSource/*.ttf" "$deployDir/bin/fonts/" -ErrorAction SilentlyContinue
          Write-Host "Copied fonts folder"
        }

        # Bundle Python embeddable for downloader scripts
        Write-Host "Setting up bundled Python..."
        $pythonVersion = "3.12.0"
        $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
        Invoke-WebRequest -Uri $pythonUrl -OutFile "python-embed.zip"
        Expand-Archive -Path "python-embed.zip" -DestinationPath "$deployDir/python" -Force

        # Enable pip in embeddable Python and configure paths
        $pthFile = "$deployDir/python/python312._pth"
        if (Test-Path $pthFile) {
          # Create proper _pth file with all needed paths (one item per line)
          "python312.zip`n.`nLib`nLib\site-packages`nimport site" | Set-Content -Path $pthFile -Encoding UTF8
          Write-Host "Configured Python path file"
          # Create Lib directory if it doesn't exist
          New-Item -ItemType Directory -Path "$deployDir/python/Lib/site-packages" -Force | Out-Null
          Write-Host "Created Lib/site-packages directory"
        }

        # Install pip
        Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
        & "$deployDir/python/python.exe" get-pip.py --no-warn-script-location

        # Install required packages for download_manager.py and pdf_watermark.py
        & "$deployDir/python/python.exe" -m pip install --no-warn-script-location yt-dlp requests reportlab PyPDF2
        Write-Host "Installed Python packages: yt-dlp, requests, reportlab, PyPDF2"

        # Clean up pip cache to reduce size
        Remove-Item -Recurse -Force "$deployDir/python/Lib/site-packages/pip" -ErrorAction SilentlyContinue
        Remove-Item "python-embed.zip" -ErrorAction SilentlyContinue
        Remove-Item "get-pip.py" -ErrorAction SilentlyContinue

        # Create portable marker
        $markerContent = "MegaCustomGUI Portable Mode`n`nThis file enables portable mode.`nSettings will be stored in this folder instead of AppData.`nDelete this file to use standard Windows settings location."
        Set-Content -Path "$deployDir/portable.marker" -Value $markerContent -Encoding UTF8

        # Create README
        $readmeContent = "MegaCustomGUI Portable`n======================`n`nThis is a portable version of MegaCustomGUI.`n`nTo run: Double-click MegaCustomGUI.exe`n`nPortable mode stores settings, jobs, logs, member and account records, local encrypted credentials, and SDK caches in this folder. Secrets saved to Windows Credential Manager remain managed by Windows.`nTo use standard Windows settings (AppData), delete the portable.marker file.`n`nSystem Requirements:`n- Windows 10 or later (64-bit)`n- No installation required"
        Set-Content -Path "$deployDir/README.txt" -Value $readmeContent -Encoding UTF8

        Write-Host "Portable distribution created in $deployDir"
        Get-ChildItem $deployDir
      shell: pwsh

    - name: Verify portable incremental updater
      run: |
        ./scripts/win-rebuild.ps1 `
          -SkipPull `
          -QtPath "${{ env.Qt6_DIR }}" `
          -VcpkgPath "${{ github.workspace }}\vcpkg" `
          -PortableDir "${{ github.workspace }}\qt-gui\MegaCustomGUI-Portable" `
          -ExpectedCommit "${{ github.sha }}"
      shell: pwsh

    - name: Upload Portable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MegaCustomGUI-Portable-Win64
        path: qt-gui/MegaCustomGUI-Portable/
        retention-days: 30

    - name: Create Release ZIP
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd qt-gui
        Compress-Archive -Path "MegaCustomGUI-Portable" -DestinationPath "MegaCustomGUI-Portable-Win64.zip"
      shell: pwsh

    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: qt-gui/MegaCustomGUI-Portable-Win64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
